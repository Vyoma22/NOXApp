name: Tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # gradlew is committed without the exec bit (built on Windows).
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest --console=plain

  ui:
    name: UI tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # MapActivityTest and MapLocationSearchTest need a working MAPS_API_KEY. With no key
          # the map stalls and they trip ActivityScenario's fixed 45s result timeout, so only
          # the view-level UI tests run here. Move them back (and supply the key) when there is
          # a secret for it. One gradle call per class because AGP truncates a comma-separated
          # -Pandroid.testInstrumentationRunnerArguments.class to its first entry.
          script: |
            for c in BrowseActivityTest ItemDetailDialogTest RemovedPickupPreferenceUiTest; do
              ./gradlew connectedDebugAndroidTest --console=plain \
                -Pandroid.testInstrumentationRunnerArguments.class=com.example.noxapp.$c || exit 1
            done
